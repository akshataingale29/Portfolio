<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" role="img" aria-label="Illustrated avatar of a female software developer">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1224"/>
      <stop offset="100%" stop-color="#050710"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#3b7bff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241a3d"/>
      <stop offset="100%" stop-color="#120c1f"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8b48c"/>
      <stop offset="100%" stop-color="#d99b6d"/>
    </linearGradient>
    <linearGradient id="topGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b7bff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#3b7bff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3b7bff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <rect width="480" height="560" fill="url(#bgGrad)"/>
  <circle cx="240" cy="230" r="210" fill="url(#glow)"/>

  <g stroke="#1b2440" stroke-width="1" opacity="0.6">
    <line x1="0" y1="80" x2="480" y2="80"/>
    <line x1="0" y1="480" x2="480" y2="480"/>
    <line x1="60" y1="0" x2="60" y2="560"/>
    <line x1="420" y1="0" x2="420" y2="560"/>
  </g>

  <circle cx="240" cy="215" r="168" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" stroke-dasharray="4 10" opacity="0.55"/>
  <circle cx="240" cy="215" r="150" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" opacity="0.35"/>

  <g transform="translate(0,10)">
    <ellipse cx="240" cy="470" rx="150" ry="26" fill="#000" opacity="0.35" filter="url(#soft)"/>

    <path d="M130 470 Q120 340 150 300 Q195 268 240 268 Q285 268 330 300 Q360 340 350 470 Z" fill="url(#topGrad)"/>
    <path d="M155 320 Q240 350 325 320 L330 470 L150 470 Z" fill="#0d1224" opacity="0.5"/>

    <path d="M158 300 Q240 330 322 300 L322 275 Q240 300 158 275 Z" fill="#0a0e1c"/>

    <circle cx="240" cy="185" r="80" fill="url(#skinGrad)"/>

    <path d="M160 175 Q150 90 240 78 Q330 90 320 175 Q320 130 290 118 Q270 145 240 130 Q210 145 190 118 Q160 130 160 175 Z" fill="url(#hairGrad)"/>
    <path d="M162 170 Q150 230 178 262 Q168 210 178 178 Z" fill="url(#hairGrad)"/>
    <path d="M318 170 Q330 230 302 262 Q312 210 302 178 Z" fill="url(#hairGrad)"/>

    <circle cx="207" cy="188" r="5.5" fill="#1c1330"/>
    <circle cx="273" cy="188" r="5.5" fill="#1c1330"/>
    <path d="M195 176 Q207 168 219 176" stroke="#3a2a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M261 176 Q273 168 285 176" stroke="#3a2a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M220 222 Q240 234 260 222" stroke="#a85c3a" stroke-width="4" fill="none" stroke-linecap="round"/>

    <rect x="150" y="330" width="180" height="118" rx="10" fill="#0a0e1c" stroke="url(#ringGrad)" stroke-width="1.5" opacity="0.9"/>
    <rect x="162" y="342" width="156" height="82" rx="4" fill="#050710"/>
    <text x="172" y="362" font-family="monospace" font-size="11" fill="#22d3ee">const dev = {</text>
    <text x="182" y="378" font-family="monospace" font-size="11" fill="#3b7bff">stack: 'Java + React',</text>
    <text x="182" y="394" font-family="monospace" font-size="11" fill="#8b5cf6">secure: true,</text>
    <text x="172" y="410" font-family="monospace" font-size="11" fill="#22d3ee">};</text>
  </g>

  <g opacity="0.9">
    <circle cx="80" cy="120" r="4" fill="#22d3ee"/>
    <circle cx="410" cy="150" r="3.5" fill="#8b5cf6"/>
    <circle cx="70" cy="380" r="3" fill="#3b7bff"/>
    <circle cx="420" cy="400" r="4" fill="#22d3ee"/>
    <circle cx="400" cy="500" r="3" fill="#8b5cf6"/>
    <circle cx="60" cy="500" r="3.5" fill="#3b7bff"/>
  </g>
</svg>
